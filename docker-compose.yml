services:
  warp:
    image: ${WARP_IMAGE:-caomingjun/warp:latest}
    restart: unless-stopped
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      # WARP also needs these capabilities under Podman.
      - MKNOD
      - AUDIT_WRITE
      - NET_ADMIN
    sysctls:
      # podman-compose 1.0.6 loses values when sysctls uses a mapping.
      - net.ipv6.conf.all.disable_ipv6=0
      - net.ipv4.conf.all.src_valid_mark=1
    environment:
      WARP_SLEEP: ${WARP_SLEEP:-5}
    expose:
      - "1080"
    volumes:
      - ./warp-data:/var/lib/cloudflare-warp
      - ./scripts/warp-healthcheck.sh:/usr/local/bin/warp-healthcheck.sh:ro
    healthcheck:
      test: ["CMD", "sh", "/usr/local/bin/warp-healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  looper-ai-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: looper-ai-gateway
    restart: unless-stopped
    env_file:
      - .env
    environment:
      UPSTREAM_PROXY_URL: http://warp:1080
      HTTP_PROXY: http://warp:1080
      HTTPS_PROXY: http://warp:1080
      NO_PROXY: localhost,127.0.0.1,::1
      # The healthcheck and port mapping target the fixed container port.
      # Set the host port in the ports mapping instead of changing PORT here.
      PORT: "8080"
    # Do not gate Gateway creation on WARP health. podman-compose can wait
    # indefinitely during first-run WARP registration or TUN initialization.
    depends_on:
      - warp
    ports:
      - "${GATEWAY_BIND_ADDRESS:-127.0.0.1}:${GATEWAY_HOST_PORT:-34567}:8080"
    volumes:
      - ./data:/app/data
      # Optional: only needed if you still want to support codex_auth_file mode
      # Replace /ABSOLUTE/PATH/TO/.codex with a real absolute path on host
      # - /ABSOLUTE/PATH/TO/.codex:/root/.codex
    healthcheck:
      # CMD-SHELL preserves Python quoting with podman-compose 1.0.6.
      test:
        - CMD-SHELL
        - >-
          python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3).read()"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    # Example admin commands:
    # docker compose exec looper-ai-gateway python manage.py doctor
    # docker compose exec looper-ai-gateway python manage.py auth-start
